<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMMT 模型深度解读课程</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9E2A2B;
            --accent-color-1: #1F3A5F;
            --accent-color-2: #C9A227;
            --neutral-color: #4A4A4A;
            --slide-background: #F6F0E2;
            --font-title: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
        }
    </style>
    <style>
        .nav-btn, .page-indicator {
            display: none;
        }
    </style>
</head>
<body>
<div class="slide-page" style="position: relative; height: 810px; width: 1440px; overflow: hidden; background: var(--slide-background); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: 'Noto Sans SC',sans-serif">
  <div style="position: absolute; left: 0px; top: 0px; height: 0.5rem; width: 100%; background-color: rgb(158 42 43 / 1)"></div>
  <div style="position: absolute; right: 3rem; top: 2.5rem; display: flex; height: 3rem; width: 3rem; align-items: center; justify-content: center; background-color: rgb(158 42 43 / 1); font-size: 0.875rem; line-height: 1.25rem; color: rgb(255 255 255 / 1); writing-mode: vertical-rl; font-family: 'Noto Serif SC',serif">贰</div>
  <div style="display: flex; height: 100%; flex-direction: column; padding-left: 5rem; padding-right: 5rem; padding-bottom: 2.5rem; padding-top: 3.5rem">
    <div style="margin-bottom: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; letter-spacing: 0.3em; color: rgb(201 162 39 / 1)">第二幕 · 用它 · 案例三</div>
    <h1 style="font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; color: rgb(158 42 43 / 1); font-family: 'Noto Serif SC',serif">个人成长：学英语 / 健身</h1>
    <div style="margin-top: 1rem; margin-bottom: 1rem; height: 3px; width: 6rem; background-color: rgb(201 162 39 / 1)"></div>
    <div style="display: grid; flex: 1 1 0%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem">
      <div style="display: flex; flex-direction: column; border-radius: 0.5rem; background-color: rgb(255 255 255 / 0.55); padding: 1.5rem">
        <p style="margin-bottom: 0.75rem; font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: rgb(31 58 95 / 1)">📘 学英语</p>
        <p style="font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)"><span style="font-weight: 600; color: rgb(158 42 43 / 1)">G</span> 读技术文档/开会（非背完 8000 词）<br><span style="font-weight: 600; color: rgb(31 58 95 / 1)">M</span> 可理解输入+高频接触，输出驱动输入<br><span style="font-weight: 600; color: rgb(31 58 95 / 1)">M</span> 沉浸阅读+每日听力+主动输出<br><span style="font-weight: 600; color: rgb(201 162 39 / 1)">T</span> Anki / 播客 / 语交App</p>
        <div style="margin-top: auto; border-radius: 0.25rem; background-color: rgb(158 42 43 / 0.1); padding-left: 1rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem"><p style="font-size: 0.875rem; line-height: 1.25rem; color: rgb(158 42 43 / 1)"><span style="font-weight: 700">🔴</span> 先囤单词书/会员，从不读说，半年无质变。</p></div>
      </div>
      <div style="display: flex; flex-direction: column; border-radius: 0.5rem; background-color: rgb(255 255 255 / 0.55); padding: 1.5rem">
        <p style="margin-bottom: 0.75rem; font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: rgb(31 58 95 / 1)">🏋 健身</p>
        <p style="font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)"><span style="font-weight: 600; color: rgb(158 42 43 / 1)">G</span> 精力充沛少受伤（非练腹肌拍照）<br><span style="font-weight: 600; color: rgb(31 58 95 / 1)">M</span> 超量恢复+渐进超负荷，动作优先<br><span style="font-weight: 600; color: rgb(31 58 95 / 1)">M</span> 分化训练+渐进负荷+睡眠营养<br><span style="font-weight: 600; color: rgb(201 162 39 / 1)">T</span> 健身房/训练App/体脂秤</p>
        <div style="margin-top: auto; border-radius: 0.25rem; background-color: rgb(158 42 43 / 0.1); padding-left: 1rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem"><p style="font-size: 0.875rem; line-height: 1.25rem; color: rgb(158 42 43 / 1)"><span style="font-weight: 700">🔴</span> 先买装备请私教，动作未建就上重量，三月受伤。</p></div>
      </div>
    </div>
    <p style="margin-top: 1rem; font-size: 0.875rem; line-height: 1.25rem; font-style: italic; color: rgb(138 130 112 / 1)">共性：都从 T 入手，跳过 M（规律未建立）。</p>
  </div>
</div>
