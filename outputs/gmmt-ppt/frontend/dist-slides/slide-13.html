<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMMT 模型深度解读课程</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9E2A2B;
            --accent-color-1: #1F3A5F;
            --accent-color-2: #C9A227;
            --neutral-color: #4A4A4A;
            --slide-background: #F6F0E2;
            --font-title: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
        }
    </style>
    <style>
        .nav-btn, .page-indicator {
            display: none;
        }
    </style>
</head>
<body>
<div class="slide-page" style="position: relative; height: 810px; width: 1440px; overflow: hidden; background: var(--slide-background); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: 'Noto Sans SC',sans-serif">
  <div style="position: absolute; left: 0px; top: 0px; height: 0.5rem; width: 100%; background-color: rgb(158 42 43 / 1)"></div>
  <div style="position: absolute; right: 3rem; top: 2.5rem; display: flex; height: 3rem; width: 3rem; align-items: center; justify-content: center; background-color: rgb(158 42 43 / 1); font-size: 0.875rem; line-height: 1.25rem; color: rgb(255 255 255 / 1); writing-mode: vertical-rl; font-family: 'Noto Serif SC',serif">叁</div>
  <div style="display: flex; height: 100%; flex-direction: column; padding-left: 5rem; padding-right: 5rem; padding-bottom: 2.5rem; padding-top: 3.5rem">
    <div style="margin-bottom: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; letter-spacing: 0.3em; color: rgb(201 162 39 / 1)">第三幕 · 验它</div>
    <h1 style="font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; color: rgb(158 42 43 / 1); font-family: 'Noto Serif SC',serif">西方框架对照</h1>
    <div style="margin-top: 1rem; margin-bottom: 1rem; height: 3px; width: 6rem; background-color: rgb(201 162 39 / 1)"></div>
    <div style="display: grid; flex: 1 1 0%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem">
      <div style="border-radius: 0.25rem; border-left-width: 4px; border-color: rgb(158 42 43 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1.25rem"><p style="font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(158 42 43 / 1)">第一性原理</p><p style="margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)">是 Lens 层的核心修炼法（怎么想透）；LGMT 给其「何时用、为谁用」的位置。</p></div>
      <div style="border-radius: 0.25rem; border-left-width: 4px; border-color: rgb(31 58 95 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1.25rem"><p style="font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(31 58 95 / 1)">手段-目的链</p><p style="margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)">LGMT 正是对「手段-目的倒置」这一认知毛病的防御性纪律——硬编码防住。</p></div>
      <div style="border-radius: 0.25rem; border-left-width: 4px; border-color: rgb(201 162 39 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1.25rem"><p style="font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(201 162 39 / 1)">黄金圈 Why-How-What</p><p style="margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)">偏沟通对齐；LGMT 偏执行排序。可叠加：用黄金圈统一 Why，用 LGMT 保不乱序。</p></div>
      <div style="border-radius: 0.25rem; border-left-width: 4px; border-color: rgb(31 58 95 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1.25rem"><p style="font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(31 58 95 / 1)">OKR / SMART / 精益</p><p style="margin-top: 0.5rem; font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)">多停留 Goal+Method 两层，是 LGMT 中 Method 层的可选组件，不处理层次次序。</p></div>
    </div>
    <div style="margin-top: 1rem; border-radius: 0.25rem; background-color: rgb(31 58 95 / 0.1); padding-left: 1.5rem; padding-right: 1.5rem; padding-top: 0.75rem; padding-bottom: 0.75rem"><p style="font-size: 0.875rem; line-height: 1.25rem; color: rgb(31 58 95 / 1)"><span style="font-weight: 700">结论：</span>它们不是互相打架，而是复用了「先定方向/规律，再选手段」的同一直觉。</p></div>
  </div>
</div>
</body>
</html>
