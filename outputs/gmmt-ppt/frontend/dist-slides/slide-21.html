<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMMT 模型深度解读课程</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9E2A2B;
            --accent-color-1: #1F3A5F;
            --accent-color-2: #C9A227;
            --neutral-color: #4A4A4A;
            --slide-background: #F6F0E2;
            --font-title: 'Noto Serif SC', serif;
            --font-body: 'Noto Sans SC', sans-serif;
        }
    </style>
    <style>
        .nav-btn, .page-indicator {
            display: none;
        }
    </style>
</head>
<body>
<div class="slide-page" style="position: relative; height: 810px; width: 1440px; overflow: hidden; background: var(--slide-background); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: 'Noto Sans SC',sans-serif">
  <div style="position: absolute; left: 0px; top: 0px; height: 0.5rem; width: 100%; background-color: rgb(158 42 43 / 1)"></div>
  <div style="position: absolute; right: 3rem; top: 2.5rem; display: flex; height: 3rem; width: 3rem; align-items: center; justify-content: center; background-color: rgb(158 42 43 / 1); font-size: 0.875rem; line-height: 1.25rem; color: rgb(255 255 255 / 1); writing-mode: vertical-rl; font-family: 'Noto Serif SC',serif">伍</div>
  <div style="display: flex; height: 100%; flex-direction: column; padding-left: 4rem; padding-right: 4rem; padding-bottom: 2.5rem; padding-top: 3rem">
    <div style="margin-bottom: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; letter-spacing: 0.3em; color: rgb(201 162 39 / 1)">第五幕 · 戒它</div>
    <h1 style="font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; color: rgb(158 42 43 / 1); font-family: 'Noto Serif SC',serif">何时放下 · 落地清单</h1>
    <div style="margin-top: 0.75rem; margin-bottom: 0.75rem; height: 3px; width: 6rem; background-color: rgb(201 162 39 / 1)"></div>
    <div style="display: grid; flex: 1 1 0%; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem">
      <div style="border-radius: 0.5rem; background-color: rgb(255 255 255 / 0.55); padding: 1.25rem">
        <p style="margin-bottom: 0.75rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(31 58 95 / 1)">何时放下（五种情形）</p>
        <div style="font-size: 0.875rem; line-height: 1.25rem; color: rgb(74 74 74 / 1)">
          <p>1. 本质是关系/意义/审美/身心 → 去相处</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)">2. 为用框架而用、硬套解释 → 停</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)">3. 目标还在涌现期 → 先试</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)">4. 推演让你迟迟不行动 → 做最小一步</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)">5. 多个 Goal 打架 → 先调和目标</p>
        </div>
      </div>
      <div style="border-radius: 0.5rem; background-color: rgb(255 255 255 / 0.55); padding: 1.25rem">
        <p style="margin-bottom: 0.75rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 700; color: rgb(31 58 95 / 1)">动手前四问（任一层答不出先别往下）</p>
        <div style="font-size: 0.875rem; line-height: 1.25rem; color: rgb(74 74 74 / 1)">
          <p><span style="font-weight: 700; color: rgb(158 42 43 / 1)">G</span> 做成什么样算成功？怎么验收？</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)"><span style="font-weight: 700; color: rgb(31 58 95 / 1)">M</span> 不可违背的根本规律是什么？真理解吗？</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)"><span style="font-weight: 700; color: rgb(31 58 95 / 1)">M</span> 具体分几步？为何适配我？</p>
          <p style="margin-top: calc(0.5rem * calc(1 - 0)); margin-bottom: calc(0.5rem * 0)"><span style="font-weight: 700; color: rgb(201 162 39 / 1)">T</span> 最低限度需要什么工具？（拒「先买再说」）</p>
        </div>
      </div>
    </div>
    <div style="margin-top: 0.75rem; display: flex; flex-wrap: wrap; -moz-column-gap: 1.5rem; column-gap: 1.5rem; row-gap: 0.25rem; border-top-right-radius: 0.25rem; border-bottom-right-radius: 0.25rem; border-left-width: 4px; border-color: rgb(158 42 43 / 1); background-color: rgb(158 42 43 / 0.1); padding-left: 1.5rem; padding-right: 1.5rem; padding-top: 0.75rem; padding-bottom: 0.75rem; font-size: 0.875rem; line-height: 1.25rem; color: rgb(158 42 43 / 1)">
      <span>🚩 先上工具/系统再说</span><span>🚩 别人都这么干</span><span>🚩 今年读 100 本书（指标替目标）</span><span>🚩 搞数字化转型（无经营目标）</span>
    </div>
  </div>
</div>
</body>
</html>
