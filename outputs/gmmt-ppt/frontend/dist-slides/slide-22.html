    <p style="margin-top: 2.5rem; max-width: 860px; font-size: 1.25rem; line-height: 1.625; color: rgb(31 58 95 / 1)">LGMT 不是某一家独创，而是把东西方「目的优先、不可颠倒」的思想，<br>压成了四步操作法。它是成就排序器，不是人生解释器——<br><span style="font-weight: 600; color: rgb(158 42 43 / 1)">顺序即纪律，放下即成熟。</span></p>
