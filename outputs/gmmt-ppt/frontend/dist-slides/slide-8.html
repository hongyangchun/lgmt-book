<div class="slide-page" style="position: relative; height: 810px; width: 1440px; overflow: hidden; background: var(--slide-background); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: 'Noto Sans SC',sans-serif">
  <div style="position: absolute; left: 0px; top: 0px; height: 0.5rem; width: 100%; background-color: rgb(158 42 43 / 1)"></div>
  <div style="position: absolute; right: 3rem; top: 2.5rem; display: flex; height: 3rem; width: 3rem; align-items: center; justify-content: center; background-color: rgb(158 42 43 / 1); font-size: 0.875rem; line-height: 1.25rem; color: rgb(255 255 255 / 1); writing-mode: vertical-rl; font-family: 'Noto Serif SC',serif">贰</div>
  <div style="display: flex; height: 100%; flex-direction: column; padding-left: 5rem; padding-right: 5rem; padding-bottom: 2.5rem; padding-top: 3.5rem">
    <div style="margin-bottom: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; letter-spacing: 0.3em; color: rgb(201 162 39 / 1)">第二幕 · 用它 · 案例一</div>
    <h1 style="font-size: 2.25rem; line-height: 2.5rem; font-weight: 700; color: rgb(158 42 43 / 1); font-family: 'Noto Serif SC',serif">家庭收纳管理</h1>
    <div style="margin-top: 1rem; margin-bottom: 1rem; height: 3px; width: 6rem; background-color: rgb(201 162 39 / 1)"></div>
    <div style="display: grid; flex: 1 1 0%; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem">
      <div style="display: flex; flex-direction: column; border-radius: 0.25rem; border-top-width: 4px; border-color: rgb(158 42 43 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1rem"><div style="font-size: 1.5rem; line-height: 2rem; font-weight: 900; color: rgb(158 42 43 / 1)">G</div><p style="margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; font-weight: 700; color: rgb(31 58 95 / 1)">愿景目标</p><p style="margin-top: 0.5rem; font-size: 0.75rem; line-height: 1.625; color: rgb(74 74 74 / 1)">30 秒找到物品、低维护成本。</p></div>
      <div style="display: flex; flex-direction: column; border-radius: 0.25rem; border-top-width: 4px; border-color: rgb(31 58 95 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1rem"><div style="font-size: 1.5rem; line-height: 2rem; font-weight: 900; color: rgb(31 58 95 / 1)">L</div><p style="margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; font-weight: 700; color: rgb(31 58 95 / 1)">视角思维</p><p style="margin-top: 0.5rem; font-size: 0.75rem; line-height: 1.625; color: rgb(74 74 74 / 1)">收纳=减少非藏；乱因=总量×位置漂移；定位一致。</p></div>
      <div style="display: flex; flex-direction: column; border-radius: 0.25rem; border-top-width: 4px; border-color: rgb(31 58 95 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1rem"><div style="font-size: 1.5rem; line-height: 2rem; font-weight: 900; color: rgb(31 58 95 / 1)">M</div><p style="margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; font-weight: 700; color: rgb(31 58 95 / 1)">具体方法</p><p style="margin-top: 0.5rem; font-size: 0.75rem; line-height: 1.625; color: rgb(74 74 74 / 1)">动线分区→断舍离→同类集中+标签→季度复盘。</p></div>
      <div style="display: flex; flex-direction: column; border-radius: 0.25rem; border-top-width: 4px; border-color: rgb(201 162 39 / 1); background-color: rgb(255 255 255 / 0.6); padding: 1rem"><div style="font-size: 1.5rem; line-height: 2rem; font-weight: 900; color: rgb(201 162 39 / 1)">T</div><p style="margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.25rem; font-weight: 700; color: rgb(31 58 95 / 1)">工具</p><p style="margin-top: 0.5rem; font-size: 0.75rem; line-height: 1.625; color: rgb(74 74 74 / 1)">收纳盒 / 标签机 / 分隔板 / 透明箱。</p></div>
    </div>
    <div style="margin-top: 1.25rem; border-top-right-radius: 0.25rem; border-bottom-right-radius: 0.25rem; border-left-width: 4px; border-color: rgb(158 42 43 / 1); background-color: rgb(158 42 43 / 0.1); padding-left: 1.5rem; padding-right: 1.5rem; padding-top: 1rem; padding-bottom: 1rem">
      <p style="font-size: 1rem; line-height: 1.5rem; font-weight: 700; color: rgb(158 42 43 / 1)">🔴 典型颠倒</p>
      <p style="margin-top: 0.25rem; font-size: 0.875rem; line-height: 1.625; color: rgb(74 74 74 / 1)">刷小红书先买 ins 风收纳盒（Tool 先行），盒子比东西多；或照搬「胶囊衣橱」却不顾通勤场景（Method 仪式化）。根子都是跳过 Lens——没想清「乱的真正原因」。</p>
    </div>
  </div>
