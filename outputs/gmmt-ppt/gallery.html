<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLMT 模型课程 · 全部 23 页总览</title>
<style>
  :root { --red:#9E2A2B; --blue:#1F3A5F; --gold:#C9A227; --paper:#F6F0E2; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Noto Sans SC', system-ui, sans-serif; background:#faf6ec; color:#2a2a2a; padding:32px; }
  header { text-align:center; margin-bottom:28px; }
  header h1 { font-family:'Noto Serif SC', serif; color:var(--red); font-size:30px; letter-spacing:2px; }
  header p { color:#666; margin-top:8px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:22px; max-width:1340px; margin:0 auto; }
  .card { background:#fff; border:1px solid #e7ddc7; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-4px); box-shadow:0 10px 24px rgba(0,0,0,.14); }
  .card a { display:block; text-decoration:none; }
  .thumb { width:100%; aspect-ratio:1440/810; object-fit:cover; background:var(--paper); display:block; }
  .meta { padding:12px 14px; border-top:3px solid var(--red); display:flex; align-items:center; }
  .meta .num { flex:0 0 auto; background:var(--red); color:#fff; font-size:12px; width:26px; height:26px; line-height:26px; text-align:center; border-radius:50%; margin-right:10px; font-weight:600; }
  .meta .title { font-size:14px; color:#333; font-weight:600; }
  footer { text-align:center; margin-top:30px; color:#999; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>GLMT 模型深度解读课程</h1>
  <p>全部 23 页总览 · 点击任意一页打开高清大图</p>
</header>
<main class="grid" id="grid"></main>
<footer>中式视觉风格 · 宣纸底 / 朱砂红 / 墨蓝 / 金</footer>
<script>
  const pages = [
    ["1","封面"],["2","五幕导航"],["3","第一幕 · 懂它"],["4","四层逻辑总览"],["5","四层如何互相支撑"],["6","不可本末倒置"],
    ["7","第二幕 · 用它"],["8","领域覆盖速览"],["9","案例 · 家庭收纳"],["10","案例 · 企业销售提效"],["11","案例 · 个人成长"],["12","案例 · 个人知识管理"],
    ["13","第三幕 · 验它"],["14","西方框架对照"],["15","系统论印证"],["16","Cynefin · 适用边界"],["17","第四幕 · 源它"],["18","道法术器印证"],
    ["19","思想谱系"],["20","第五幕 · 戒它"],["21","局限与谬误光谱"],["22","何时放下 · 落地清单"],["23","结语"]
  ];
  const base = "file:///Users/hongyangchun/Codebase/default/outputs/gmmt-ppt/frontend/public/assets/images/posters/pages/page-";
  const grid = document.getElementById('grid');
  pages.forEach(([n,t])=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<a href="${base}${n}.png" target="_blank"><img class="thumb" src="${base}${n}.png" alt="第${n}页 ${t}" loading="lazy"><div class="meta"><span class="num">${n}</span><span class="title">${t}</span></div></a>`;
    grid.appendChild(card);
  });
</script>
</body>
</html>
